name: Deploy

# Every merge to main deploys the browser host (/host), the game client (/play) and
# World 1 from the same commit, so all three speak the same protocol.
# The build job runs repo code without deploy secrets; the deploy job holds them and
# runs only this file and .github/scripts/ftp-upload.mjs.
on:
    push:
        branches: [main]
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: deploy
    cancel-in-progress: false

jobs:
    build:
        if: github.repository == 'RSPSApp/tsps' && github.ref == 'refs/heads/main'
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
              with:
                  path: tsps
            # The host scripts expect tsps beside the website checkout (../../tsps from host/).
            - uses: actions/checkout@v4
              with:
                  repository: tobywisener/rsps-website
                  token: ${{ secrets.RSPS_WEBSITE_TOKEN }}
                  path: rsps-website
                  persist-credentials: false
            - uses: actions/setup-node@v4
              with:
                  node-version: 22
            - run: corepack enable
            - uses: actions/cache@v4
              with:
                  path: tsps/server/caches
                  key: osrs-cache-${{ hashFiles('tsps/server/target.txt') }}
            - name: Install
              run: |
                  (cd tsps/server && yarn install --immutable)
                  (cd tsps/client && yarn install --immutable)
                  (cd rsps-website/host && corepack yarn@1.22.22 install --frozen-lockfile)
            - name: Build host
              working-directory: rsps-website/host
              run: |
                  corepack yarn@1.22.22 typecheck
                  corepack yarn@1.22.22 build
                  # The snapshot build only warns when ensure-cache fails; refuse to ship without it.
                  test -f build/browser-host/cache/main_file_cache.dat2
            - name: Build client
              working-directory: tsps/client
              # CRA fails the build on warnings when CI is set.
              run: CI=false corepack yarn run build
            - uses: actions/upload-artifact@v4
              with:
                  name: host
                  path: rsps-website/host/build
                  retention-days: 1
            - uses: actions/upload-artifact@v4
              with:
                  name: client
                  path: tsps/client/build
                  retention-days: 1

    deploy:
        needs: build
        runs-on: ubuntu-latest
        # Holds the FTP and World 1 secrets; restricted to main in the environment settings.
        environment: production
        steps:
            - uses: actions/checkout@v4
              with:
                  sparse-checkout: .github/scripts
                  persist-credentials: false
            - uses: actions/setup-node@v4
              with:
                  node-version: 22
            - run: npm install --prefix .github/scripts --no-save --ignore-scripts basic-ftp@6.2.1
            - uses: actions/download-artifact@v4
              with:
                  path: dist
            - name: Upload host and client
              env:
                  FTP_HOST: ${{ secrets.FTP_HOST }}
                  FTP_PORT: ${{ secrets.FTP_PORT }}
                  FTP_USER: ${{ secrets.FTP_USER }}
                  FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
                  FTP_TLS_SERVERNAME: ${{ secrets.FTP_TLS_SERVERNAME }}
                  FTP_REMOTE_DIR: ${{ secrets.FTP_REMOTE_DIR }}
              run: |
                  node .github/scripts/ftp-upload.mjs dist/host "$FTP_REMOTE_DIR"
                  node .github/scripts/ftp-upload.mjs dist/client /play
            # The key's forced command on the VPS is /usr/local/bin/tsps-deploy, which
            # fast-forwards /root/tsps to this commit, builds and restarts World 1.
            - name: Deploy World 1
              env:
                  VPS_DEPLOY_KEY: ${{ secrets.VPS_DEPLOY_KEY }}
              run: |
                  install -m 700 -d ~/.ssh
                  printf '%s\n' "$VPS_DEPLOY_KEY" > ~/.ssh/world1 && chmod 600 ~/.ssh/world1
                  echo '192.209.62.27 ssh-rsa ' > ~/.ssh/known_hosts
                  ssh -i ~/.ssh/world1 -o IdentitiesOnly=yes -o BatchMode=yes root@192.209.62.27 "$GITHUB_SHA"
