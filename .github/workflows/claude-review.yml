name: Claude review

# Comment "@claude review" (or any @claude question) on a pull request. It runs on one
# person's Claude subscription, so only their comments trigger it. Comment events always run
# this file from main, so fork PRs get the same read-only setup: Claude can comment, but cannot
# push or run the PR's code.
on:
    issue_comment:
        types: [created]
    pull_request_review_comment:
        types: [created]

concurrency:
    group: claude-review-${{ github.event.issue.number || github.event.pull_request.number }}
    cancel-in-progress: false

jobs:
    claude:
        if: >
            github.repository == 'RSPSApp/tsps' &&
            (github.event_name == 'pull_request_review_comment' || github.event.issue.pull_request) &&
            contains(github.event.comment.body, '@claude') &&
            github.event.comment.user.login == 'Bandit-HaxUnit'
        runs-on: ubuntu-latest
        timeout-minutes: 30
        permissions:
            contents: read
            pull-requests: write
            issues: write
            actions: read
        steps:
            - uses: actions/checkout@v4
              with:
                  fetch-depth: 1

            - uses: anthropics/claude-code-action@v1
              id: claude
              with:
                  # A Claude Pro/Max subscription token from `claude setup-token`.
                  claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
                  github_token: ${{ secrets.GITHUB_TOKEN }}
                  claude_args: |
                      --model claude-sonnet-5-5
                      --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr diff:*),Bash(gh pr view:*),Bash(git diff:*),Bash(git log:*)"
                      --disallowedTools "Edit,MultiEdit,Write,NotebookEdit,Bash(git add:*),Bash(git commit:*),Bash(git rm:*)"
                      --append-system-prompt 'You are reviewing a pull request on tsps, a TypeScript OSRS server and web client, from GitHub Actions. You cannot run the server, the client, tests or the agent MCP.

                      Ignore the worktree, port, agent MCP and "Ready to test" instructions in the root AGENTS.md; they are for local agents only.

                      When asked to review:
                      1. Get the diff with gh pr diff. Skip large generated or data files (JSON under server/data/ and data/definitions/, cache dumps, capture-derived data) beyond a sanity check of their shape.
                      2. If the diff touches server/, read server/AGENTS.md first and check every change against its numbered rules. Then read the topic docs under server/docs/agents/ that match the change, using the table at the end of server/AGENTS.md (plugins.md for plugin structure, events, members and commands; areas.md for area-scoped content; cache.md for ids; interfaces.md and sources.md when relevant). testing.md and perf.md describe local tools you do not have.
                      3. Rules you can check from the code: core accessed only through api.core, register is attach-only, hooks by name with no bare numeric ids, custom events instead of feature hooks in PluginManager, members: true on members content, Area instead of global per-player hooks, command ranks declared at registration, no one-off special cases, kebab-case namespaced attribute keys in a *_ATTRIBUTE constant with persistAttribute defaults, plugin data beside its plugin, unit file names ending with the plugin name, and the pattern of the module being changed.
                      4. Ids and behaviour (rules 9 and 10) come from the cache and the OSRS Wiki, which you cannot check. Point out ids or behaviour that look guessed and ask where they came from; do not claim they are wrong. Flag any PR or code comment that cites another RSPS as its source.
                      5. client/ has no agent docs; review it for correctness bugs, leaks and per-frame cost.
                      6. Look for real bugs too: wrong conditions, missing null checks on players or NPCs that can log out or despawn, state that is never cleared, timers or tasks that outlive their owner.

                      Post every finding tied to specific code as an inline comment on that line with mcp__github_inline_comment__create_inline_comment, before writing the summary. Then keep the summary comment short: what the PR does, then one line per finding, most severe first, linking or naming the line it was posted on.
                      Before asking the author a question, check whether the repo answers it: search for where a value is set, where a function is called, or what a constant covers, and follow timing through the code (scheduled tasks, delays, tick counts). If the code answers it, state the answer and its consequence as the finding, citing the file and line. Only ask when the answer depends on the cache, the Wiki, live captures or intent.
                      Only report findings that need an action from the author: a fix, a check, or an answer. Leave out observations that need no change, such as duplication the language forces or tests that still pass. Do not pad the review with praise or style nits the surrounding code does not follow. If there is nothing worth changing, say so in one line.

                      For any other @claude question, answer it directly from the code.'

            # The action hides Claude's output on public repos. When a run fails, print only the
            # final result message (an API or auth error), not the tool output.
            - name: Show Claude error
              if: failure() && steps.claude.outputs.execution_file != ''
              env:
                  EXECUTION_FILE: ${{ steps.claude.outputs.execution_file }}
              run: jq -r '.[] | select(.type == "result") | {result, errors}' "$EXECUTION_FILE"
